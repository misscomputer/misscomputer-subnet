name: gVisor disposable-runner gate

# New workflows cannot be workflow_dispatch'ed before they reach main. A
# maintainer applies this label to run the exact PR head on a hosted VM.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  conformance:
    if: >-
      github.event.label.name == 'run-gvisor-gate' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install XFS tooling and record runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xfsprogs=6.6.0-1ubuntu2.1
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          printf 'Kernel: %s\n' "$(uname -r)"
          systemctl --version | head -1
          docker version
          mkfs.xfs -V
      - name: Prove runsc and disk quota on isolated daemon
        env:
          MC_GVISOR_DISPOSABLE_RUNNER: "1"
        run: sudo --preserve-env=MC_GVISOR_DISPOSABLE_RUNNER,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ID,GITHUB_STEP_SUMMARY,RUNNER_TEMP bash scripts/prove-gvisor-disposable.sh
