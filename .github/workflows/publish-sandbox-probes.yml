name: publish-sandbox-probes

# Manual only. Publishes the nine reviewed sandbox probe images byte for
# byte (docs/sandbox-probe-images.md). "publish" rebuilds the layout,
# requires build_probe_images.py --verify and the committed pins, and copies
# each manifest with a checksum-pinned oras using this job's GITHUB_TOKEN.
# "check-public" needs no credentials: it reads every pinned manifest, blob
# and tag anonymously. The publish job runs in the "probe-publication"
# environment, which an org owner configures (required reviewer, no
# administrator bypass, deployments from main only) and which the job
# checks before it touches the registry. Making the package public is an
# org owner's step in the package settings; nothing here can do it. The
# guards in this file bind only this file: see "What the environment does
# not cover" in docs/sandbox-probe-images.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "publish: rebuild, verify and push; check-public: anonymous digest check only"
        type: choice
        options:
          - publish
          - check-public
        default: publish
      expected_sha:
        description: "Full SHA of the reviewed commit; the run refuses any other"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-sandbox-probes
  cancel-in-progress: false

env:
  PROBE_REPOSITORY: ghcr.io/misscomputer/sandbox-probes
  ORAS_VERSION: "1.3.4"
  ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454

jobs:
  publish:
    if: inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: probe-publication
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Require the reviewed commit on main
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "run from main only, not $GITHUB_REF"; exit 1; }
          [ "$EXPECTED_SHA" = "$GITHUB_SHA" ] || { echo "expected_sha $EXPECTED_SHA is not $GITHUB_SHA"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require the owner-configured environment protection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/sandbox-probes/publish-probes.sh check-environment "$GITHUB_REPOSITORY" probe-publication
      - name: Rebuild and verify the layout
        run: scripts/sandbox-probes/publish-probes.sh layout "$RUNNER_TEMP/probe-layout"
      - name: Install the pinned oras
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o oras.tar.gz "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  oras.tar.gz" | sha256sum -c -
          mkdir oras-bin
          tar -xzf oras.tar.gz -C oras-bin oras
          echo "$RUNNER_TEMP/oras-bin" >> "$GITHUB_PATH"
      - name: Push the nine manifests
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'oras logout ghcr.io' EXIT
          scripts/sandbox-probes/publish-probes.sh push "$RUNNER_TEMP/probe-layout" "$PROBE_REPOSITORY" | tee "$RUNNER_TEMP/publication.txt"
      - name: Record the publication
        run: |
          {
            echo "run ${GITHUB_RUN_ID} at ${GITHUB_SHA}"
            echo "oras ${ORAS_VERSION} sha256 ${ORAS_SHA256}"
            cat "$RUNNER_TEMP/publication.txt"
          } | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/publication-record.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-probes-publication
          path: ${{ runner.temp }}/publication-record.txt
          retention-days: 90

  check-public:
    if: inputs.mode == 'check-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read every pinned manifest and blob anonymously
        run: scripts/sandbox-probes/publish-probes.sh check-public "$PROBE_REPOSITORY" | tee -a "$GITHUB_STEP_SUMMARY"
